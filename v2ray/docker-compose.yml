version: '3.8'

services:
  v2ray-server:
    image: v2fly/v2fly-core:latest
    container_name: v2ray-server
    ports:
      - "10086:10086/tcp"
    volumes:
      - ./v2ray/server-config.json:/etc/v2ray/config.json:ro
      - v2ray-log:/var/log/v2ray
    restart: unless-stopped
    networks:
      - v2ray-network
    environment:
      - TZ=UTC

  v2ray-client:
    image: v2fly/v2fly-core:latest
    container_name: v2ray-client
    ports:
      - "1080:1080/tcp"
      - "1080:1080/udp"
      - "1081:1081/tcp"
    volumes:
      - ./v2ray/client-config.json:/etc/v2ray/config.json:ro
    restart: unless-stopped
    networks:
      - v2ray-network
    environment:
      - TZ=UTC
    depends_on:
      - v2ray-server

volumes:
  v2ray-log:
    driver: local

networks:
  v2ray-network:
    driver: bridge